name: CI Build and Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Check
        run: npx tsc -b

      - name: Build Web App Bundle
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Gradle for CI
        run: |
          mkdir -p $HOME/gradle-home
          echo "GRADLE_USER_HOME=$HOME/gradle-home" >> $GITHUB_ENV
          if [ -f android/gradle.properties ]; then
            sed -i 's/-Xmx[0-9]*m/-Xmx3072m/g' android/gradle.properties || true
          fi

      - name: Initialize Capacitor Android
        run: |
          npx --yes @capacitor/cli init "OneNote Clone" "com.onenote.clone" --web-dir dist || true
          npm install @capacitor/android
          npx --yes @capacitor/cli add android || true
          npx --yes @capacitor/cli sync android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
